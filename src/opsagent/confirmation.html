<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refund Status Portal — public confirmations</title>
<style>
  :root{ --paper:#eef1f0; --card:#f7f9f8; --ink:#1b2321; --faint:#6f7c78;
    --rule:#d3dad7; --teal:#0d5a56; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,sans-serif;padding:20px}
  h1{font-size:18px;margin:0 0 4px}
  .env{font-size:11px;color:var(--faint);border:1px solid var(--rule);border-radius:20px;padding:2px 10px}
  .row{margin-top:14px;display:flex;gap:6px;align-items:flex-start}
  textarea{font:inherit;width:420px;height:52px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px}
  button{font:inherit;font-size:13px;border:1px solid var(--rule);background:#fff;color:var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--teal);color:var(--teal)}
  #confirmation{margin-top:16px;padding:12px 14px;min-height:44px;background:var(--card);
    border:1px solid var(--rule);border-radius:8px;white-space:pre-wrap}
  #confirmation[data-empty="true"]{color:var(--faint);font-style:italic}
</style>
</head>
<body>
  <header>
    <h1>Refund Status Portal</h1>
    <span class="env">public confirmations · no API · agent-operated</span>
  </header>

  <div class="row">
    <textarea id="draft" placeholder="confirmation text"></textarea>
    <button id="post" data-act="post">Post confirmation</button>
  </div>

  <!-- The published confirmation the public sees. It is the single source of
       truth the harness reads back: the verdict for the "post" action comes
       from THIS element's text, never from what the agent claims. -->
  <div id="confirmation" data-empty="true">no confirmation posted yet</div>

<script>
// The only control that mutates the published confirmation is the button
// below, exactly as a human (or a browser agent driving the DOM) would click.
// Nothing writes #confirmation from outside, so an agent's effect on the world
// is observable precisely as the real portal would show it.
const draft = document.getElementById("draft");
const out = document.getElementById("confirmation");

function post(){
  const text = draft.value;
  if(text.length === 0) return;
  out.textContent = text;
  out.setAttribute("data-empty", "false");
}

document.getElementById("post").addEventListener("click", post);

// ---- Automation surface (used by Playwright; not by human operators) ----
// current text is simply read via inner_text(#confirmation); no seam needed.
</script>
</body>
</html>
