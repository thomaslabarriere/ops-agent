[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-agent"
version = "0.1.0"
description = "A small autonomous operations agent that executes a real workflow end-to-end, with a task-success + guardrail-violation reliability harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
# Optional: the real headless-browser mode (--browser real). Pulls Playwright;
# Chromium (~150 MB) is then installed separately via
# `python -m playwright install chromium`. The offline core never needs this.
browser = [
  "playwright>=1.40",
]

[project.scripts]
ops-agent = "opsagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsagent"]
# Ship the toy confirmation page so --browser real can load it over file://.
artifacts = ["src/opsagent/confirmation.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/opsagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
